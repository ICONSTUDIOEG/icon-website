# =====================================================================
#  www.iconstudio.tech · ICON Studio website
#
#  nginx downloads the site from github.com/ICONSTUDIOEG/icon-website
#  at a pinned commit on every start, then serves it. Routing follows
#  plates/grad: shared Traefik network n8n_default, websecure entrypoint,
#  mytlschallenge certificate resolver. The bare domain redirects to www.
#  To publish a new version: push to the repo, set REV below, redeploy.
# =====================================================================
services:
  web:
    image: nginx:alpine
    container_name: icon-website-web
    restart: unless-stopped
    environment:
      REV: "__REV__"
    networks:
      - traefik-shared
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.iconweb-www.rule=Host(`www.iconstudio.tech`)"
      - "traefik.http.routers.iconweb-www.entrypoints=websecure"
      - "traefik.http.routers.iconweb-www.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.iconweb-www.service=iconweb"
      - "traefik.http.routers.iconweb-apex.rule=Host(`iconstudio.tech`)"
      - "traefik.http.routers.iconweb-apex.entrypoints=websecure"
      - "traefik.http.routers.iconweb-apex.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.iconweb-apex.middlewares=iconweb-apex2www"
      - "traefik.http.routers.iconweb-apex.service=iconweb"
      - "traefik.http.middlewares.iconweb-apex2www.redirectregex.regex=^https://iconstudio\\.tech/(.*)"
      - "traefik.http.middlewares.iconweb-apex2www.redirectregex.replacement=https://www.iconstudio.tech/$${1}"
      - "traefik.http.middlewares.iconweb-apex2www.redirectregex.permanent=true"
      - "traefik.http.services.iconweb.loadbalancer.server.port=80"
    command:
      - sh
      - -c
      - |
        set -e
        H=/usr/share/nginx/html
        B="https://raw.githubusercontent.com/ICONSTUDIOEG/icon-website/$$REV"
        rm -rf $$H/* && mkdir -p $$H/assets/clients
        for f in index.html robots.txt \
          assets/icon-logo.png \
          assets/ricopeka-poster.jpg \
          assets/ricopeka-intro-720.mp4 \
          assets/showreel-hero-poster.jpg \
          assets/showreel-poetic-poster.jpg \
          assets/showreel-punchy-poster.jpg \
          assets/icon-showreel-hero-720.mp4 \
          assets/icon-showreel-poetic-720.mp4 \
          assets/icon-showreel-punchy-vertical.mp4 \
          assets/omar-khairat-poster.jpg \
          assets/omar-khairat-opening-720.mp4 \
          assets/plastic-civilization-poster.jpg \
          assets/plastic-civilization-720.mp4 \
          assets/clients/huawei.png \
          assets/clients/who.png \
          assets/clients/expo-2020-dubai.png \
          assets/clients/jeem.png \
          assets/clients/audio-technology.png; do
          wget -qO "$$H/$$f" "$$B/$$f"
        done
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          charset utf-8;
          gzip on;
          gzip_types text/css application/javascript image/svg+xml;
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          location = /index.html { add_header Cache-Control "no-cache" always; }
          location /assets/ { add_header Cache-Control "public, max-age=604800" always; }
          location / { try_files $$uri $$uri/ =404; }
        }
        CONF
        echo "icon-website $$REV ready"
        exec nginx -g 'daemon off;'

networks:
  traefik-shared:
    external: true
    name: n8n_default
